# Publishes to npm when you create a GitHub release (tag like v0.1.1).
# Uses npm trusted publishing: no token is stored in GitHub, and npm attaches
# a provenance statement proving the package was built from this repository.
name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1+
      - run: npm install
      - name: Release tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then echo "Tag v$TAG does not match package.json $VERSION"; exit 1; fi
      - run: npm publish --access public
