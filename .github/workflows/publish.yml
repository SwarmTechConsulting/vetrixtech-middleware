# Publishes to npm when you create a GitHub release (tag like v0.1.2).
# Uses npm trusted publishing: no token is stored anywhere, and npm attaches
# a provenance statement proving the package was built from this repository.
#
# Note: setup-node deliberately has NO registry-url. With registry-url set, setup-node
# writes an .npmrc that points npm at a token login, and npm then skips the
# trusted-publishing (OIDC) login and fails with a misleading E404.
name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1+
      - name: Show versions
        run: node --version && npm --version
      - run: npm install
      - name: Release tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then echo "Tag v$TAG does not match package.json $VERSION"; exit 1; fi
      - run: npm publish --access public --provenance
